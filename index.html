<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta Honey Hands</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #faf8f5;
      color: #4a3e3d;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #7a632a;
      margin-bottom: 5px;
    }
    p {
      font-size: 14px;
      color: #666;
    }
    .wheel-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 30px auto;
    }
    .arrow {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 24px solid #7a632a;
      z-index: 10;
    }
    #wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid #c59b27;
      box-sizing: border-box;
      transition: transform 4s cubic-bezier(0.15, 0.9, 0.2, 1);
      background: conic-gradient(
        #e6c280 0deg 36deg,
        #b8d4e3 36deg 72deg,
        #f0d598 72deg 108deg,
        #e6c280 108deg 144deg,
        #b8d4e3 144deg 180deg,
        #f0d598 180deg 216deg,
        #e6c280 216deg 252deg,
        #b8d4e3 252deg 288deg,
        #f0d598 288deg 324deg,
        #e6c280 324deg 360deg
      );
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    button {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      background-color: #c59b27;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(197, 155, 39, 0.3);
      transition: all 0.2s ease;
    }
    button:hover {
      background-color: #b08920;
    }
    button:disabled {
      background-color: #ccc;
      box-shadow: none;
      cursor: not-allowed;
    }
    #msg {
      margin-top: 20px;
      font-weight: bold;
      font-size: 16px;
      color: #5a4b27;
    }
  </style>
</head>
<body>

  <h1>Honey Hands</h1>
  <p>Gira la ruleta (máximo 3 intentos por persona)</p>

  <div class="wheel-container">
    <div class="arrow"></div>
    <div id="wheel"></div>
  </div>

  <button id="spinBtn" onclick="spin()">¡GIRAR RULETA!</button>
  <p id="msg"></p>

  <script>
    let spins = parseInt(localStorage.getItem('user_spins') || '0');
    const maxSpins = 3;
    const btn = document.getElementById('spinBtn');
    const msg = document.getElementById('msg');
    let currentRotation = 0;

    if (spins >= maxSpins) {
      btn.disabled = true;
      msg.innerText = "Ya has completado tus 3 intentos.";
    } else {
      msg.innerText = `Llevas ${spins} de ${maxSpins} intentos.`;
    }

    function spin() {
      if (spins < maxSpins) {
        btn.disabled = true;
        spins++;
        localStorage.setItem('user_spins', spins);
        
        const randomDegree = Math.floor(3600 + Math.random() * 360);
        currentRotation += randomDegree;
        document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;
        
        setTimeout(() => {
          msg.innerText = `Llevas ${spins} de ${maxSpins} intentos.`;
          if (spins < maxSpins) {
            btn.disabled = false;
          } else {
            msg.innerText = "¡Has completado tus 3 intentos!";
          }
        }, 4000);
      }
    }
  </script>
</body>
</html>
